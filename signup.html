<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>성북굿잡 - 회원가입</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            color: #1a1a2e; 
            background: linear-gradient(-45deg, #f1f5f9, #e2e8f0, #cbd5e1, #f8fafc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-elements {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .floating-item {
            position: absolute; font-weight: 900; color: #cbd5e1; opacity: 0.4; user-select: none;
        }
        .item-A { font-size: 280px; top: 10%; left: 2%; animation: float 8s ease-in-out infinite; }
        .item-b { font-size: 220px; bottom: 10%; right: 2%; animation: float 10s ease-in-out infinite reverse; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        header { 
            display: flex; justify-content: space-between; align-items: center; padding: 0 50px; 
            background-color: rgba(255, 255, 255, 0.95); border-bottom: 1px solid #f0f0f0; 
            height: 80px; backdrop-filter: blur(10px);
        }
        .logo { font-size: 24px; font-weight: 900; text-decoration: none; color: #1a1a2e; letter-spacing: -1px; }

        .signup-wrapper {
            max-width: 460px;
            width: 100%;
            margin: 50px auto 70px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .signup-title {
            text-align: center;
            margin-bottom: 28px;
        }
        .signup-title h2 {
            font-size: 26px;
            font-weight: 800;
            color: #1a365d;
            margin-bottom: 8px;
        }
        .signup-title p {
            font-size: 14px;
            color: #718096;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: white;
            font-family: inherit;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #059669;
        }

        .form-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #718096;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .form-footer a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 700;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="bg-elements">
        <div class="floating-item item-A">G</div>
        <div class="floating-item item-b">J</div>
    </div>

    <header>
        <a href="index.html" class="logo">Seongbuk GoodJob</a>
        <a href="index.html" style="text-decoration: none; color: #4a5568; font-weight: bold; font-size: 14px;">🏠 홈으로</a>
    </header>

    <main>
        <div class="signup-wrapper">
            <div class="signup-title">
                <h2>성북굿잡 회원가입</h2>
                <p>무료 회원가입으로 AI 맞춤 일자리 매칭을 시작하세요.</p>
            </div>

            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label for="name">이름 (닉네임)</label>
                    <input type="text" id="name" class="form-control" placeholder="홍길동" required>
                </div>

                <div class="form-group">
                    <label for="email">이메일 계정</label>
                    <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" class="form-control" placeholder="비밀번호 입력" required>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <input type="password" id="passwordConfirm" class="form-control" placeholder="비밀번호 재입력" required>
                </div>

                <button type="submit" class="btn-submit" id="signupBtn">가입 완료하기</button>
            </form>

            <div class="form-footer">
                <span>이미 계정이 있으신가요?</span>
                <a href="login.html">로그인하기 👉</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Seongbuk GoodJob. All rights reserved.
    </footer>

    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:8000' 
            : 'https://albacare.onrender.com';

        async function handleSignUp(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const passwordConfirm = document.getElementById('passwordConfirm').value.trim();
            const signupBtn = document.getElementById('signupBtn');

            if (password !== passwordConfirm) {
                alert('비밀번호가 서로 일치하지 않습니다. 다시 확인해 주세요.');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerText = "처리 중...";

            try {
                const response = await fetch(`${BACKEND_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '회원가입에 실패했습니다.');
                }

                alert('회원가입이 완료되었습니다! 로그인해 주세요.');
                location.href = 'login.html';

            } catch (error) {
                alert(error.message);
            } finally {
                signupBtn.disabled = false;
                signupBtn.innerText = "가입 완료하기";
            }
        }
    </script>
</body>
</html>
